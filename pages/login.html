<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Digital Services</title>

  <link rel="stylesheet" href="../css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/app.js" defer></script>
</head>

<body>

  <header class="header">
    <nav class="navbar">
      <a href="../index.html" class="logo">Digital Services</a>

      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="register.html">Register</a>
      </div>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card">

      <h1>Welcome Back!</h1>

      <p>Login to your Digital Services account.</p>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">Email Address</label>

          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>

          <input
            type="password"
            id="loginPassword"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary">
          Login
        </button>

        <p id="loginMessage" role="status" aria-live="polite"></p>

      </form>

      <p>
        <a href="#" id="showForgot">Forgot Password?</a>
      </p>

      <p>
        Don't have an account?
        <a href="register.html">Create Account</a>
      </p>

      <a href="../index.html">← Back to Home</a>

    </section>
  </main>

  <footer class="footer">
    <p>
      &copy; <span id="year"></span> Digital Services.
      All rights reserved.
    </p>
  </footer>

</body>
</html>
