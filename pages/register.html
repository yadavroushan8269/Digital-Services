<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Digital Services</title>

  <link rel="stylesheet" href="../css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/app.js" defer></script>
</head>

<body>

  <header class="header">
    <nav class="navbar">
      <a href="../index.html" class="logo">Digital Services</a>

      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="login.html">Login</a>
      </div>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card">

      <h1>Create Your Account</h1>

      <p>Join Digital Services to get started.</p>

      <form id="signupForm">

        <div class="form-group">
          <label for="signupUsername">Full Name</label>

          <input
            type="text"
            id="signupUsername"
            name="username"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address</label>

          <input
            type="email"
            id="signupEmail"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>

          <input
            type="password"
            id="signupPassword"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Enter password again"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary">
          Create Account
        </button>

        <p id="signupMessage" role="status" aria-live="polite"></p>

      </form>

      <p>
        Already have an account?
        <a href="login.html">Login here</a>
      </p>

      <a href="../index.html">← Back to Home</a>

    </section>
  </main>

  <footer class="footer">
    <p>
      &copy; <span id="year"></span> Digital Services.
      All rights reserved.
    </p>
  </footer>

</body>
</html>
