<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Profile | Digital Services</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/app.js" defer></script>
</head>

<body>

  <header class="header">
    <nav class="navbar">
      <a href="../index.html" class="logo">Digital Services</a>

      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="services.html">Services</a>
        <a href="order.html">My Orders</a>
        <a href="wallet.html">Wallet</a>
        <a href="support.html">Support</a>
      </div>
    </nav>
  </header>

  <main class="dashboard-container">

    <section class="dashboard-heading">
      <h1>My Profile</h1>
      <p>View and manage your account information.</p>
    </section>

    <section class="auth-container">
      <div class="auth-card">

        <h2>Account Details</h2>

        <form id="profileForm">

          <div class="form-group">
            <label for="profileName">Full Name</label>
            <input
              type="text"
              id="profileName"
              name="username"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            >
          </div>

          <div class="form-group">
            <label for="profileEmail">Email Address</label>
            <input
              type="email"
              id="profileEmail"
              name="email"
              placeholder="Your registered email"
              autocomplete="email"
              readonly
            >
          </div>

          <button type="submit" class="btn btn-primary">
            Save Changes
          </button>

          <p id="profileMessage" role="status" aria-live="polite"></p>

        </form>

      </div>
    </section>

    <section class="dashboard-section">
      <h2>Account Shortcuts</h2>

      <div class="dashboard-actions">
        <a href="order.html" class="btn btn-primary">My Orders</a>
        <a href="wallet.html" class="btn btn-primary">My Wallet</a>
        <a href="support.html" class="btn btn-primary">Get Support</a>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>
      &copy; <span id="year"></span> Digital Services.
      All rights reserved.
    </p>
  </footer>

</body>
</html>
